/* ================= MODULE 5 — INTEGRATION & THE FTC ================= */
function c4_recall(){recallFrom(`Module 5 introduces the derivative's mirror image — so first rebuild the whole toolkit, from the function library through limits, the derivative, and its applications. Integration will lean on all of it.`,['c0','c1','c2','c3'],RECALL_HINT);}

function c4_intro(){
  stage.innerHTML=`<div class="card"><h2>The second pillar: accumulation</h2>
    <p>Module 1's intro named calculus's two questions. You've spent three modules on the first — <em>how fast is something changing?</em> — and answered it with the derivative. Now the second: <b>how much accumulates?</b></p>
    <p>Drive at a known speed and the distance covered is the <em>area</em> under the speed-vs-time graph. Pump water at a varying rate and the total delivered is the <em>area</em> under the rate curve. Accumulation is <b>area under a curve</b> — and that's the trouble. Geometry hands you the area of a rectangle or triangle, but the region under a curve like $y=x^2$ has a curved lid and no formula.</p>
    <p>The plan mirrors how the derivative was built. There, we approximated a tangent by secants and took a limit; here, we'll approximate a curved area by <b>rectangles</b> and take a limit — the <b>definite integral</b>. Then comes the surprise that names the module: the <b>Fundamental Theorem of Calculus</b>, which reveals that this area problem and the slope problem are <em>inverses</em> of each other. Accumulating and rating-of-change undo one another.</p>
    <div class="task"><b>Frame it</b>If $v(t)$ is speed at time $t$, what does the area under $v$ between $t=0$ and $t=5$ represent?</div>
    <div class="choices" id="ch"></div></div>`;
  const opts=[['the total <b>distance</b> travelled over those 5 seconds','y'],['the <b>acceleration</b> at $t=5$','n'],['the top <b>speed</b> reached','n'],['the <b>slope</b> of the speed graph','n']];
  mcChoices(document.getElementById('ch'),opts,()=>{addReveal(`<div class="rh">✓ Distance = area under the speed curve</div><p>Speed $\\times$ time is distance; when speed varies, you sum up speed over each tiny slice of time — exactly the area under $v(t)$. Rate integrated over an interval gives the total accumulated. That's the whole idea of the definite integral, and the next beat builds it from rectangles.</p>`);});
  setHints([`Speed × time = distance. Summing speed over each slice of time accumulates total distance.`]);
}

function c4_riemann(){
  stage.innerHTML=`<div class="card"><h2>Riemann sums: pave the area with rectangles</h2>
    <p>To approximate the area under $f(x)=x^2$ from $0$ to $3$, slice the interval into $n$ equal strips of width $\\Delta x = \\frac{3}{n}$, cap each strip with a rectangle whose height is the curve's value at the strip's right edge, and add them up:</p>
    <div class="eqbox">$$R_n = \\sum_{i=1}^{n} f(x_i)\\,\\Delta x, \\qquad x_i = i\\,\\Delta x$$</div>
    <p>Each rectangle is crude, but crank $n$ up and the staircase hugs the curve. Tap to add rectangles and watch the sum settle.</p>
    <div class="seg" id="seg"></div>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">n rectangles</div><div class="v" id="nv">—</div></div><div class="rdc"><div class="k">Rₙ (sum)</div><div class="v" id="rv">—</div></div></div>
    <div class="task"><b>Find the limit</b>As $n$ grows, the sums close in on one number — the exact area. Enter it.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:-0.3,xmax:3.3,ymin:-0.6,ymax:9.8});
  const f=x=>x*x,A=0,B=3;let n=6;
  const riem=n=>{let s=0;const dx=(B-A)/n;for(let i=1;i<=n;i++)s+=f(A+i*dx)*dx;return s;};
  function draw(){pl.grid();const{ctx}=pl;const dx=(B-A)/n;
    for(let i=0;i<n;i++){const xl=A+i*dx,h=f(xl+dx);const X0=pl.px(xl),X1=pl.px(xl+dx),Y0=pl.py(0),Y1=pl.py(h);
      ctx.fillStyle='rgba(122,184,255,0.16)';ctx.fillRect(X0,Y1,X1-X0,Y0-Y1);
      ctx.strokeStyle='rgba(122,184,255,0.55)';ctx.lineWidth=1;ctx.strokeRect(X0,Y1,X1-X0,Y0-Y1);}
    pl.curve(f,'#7ab8ff');
    document.getElementById('nv').textContent=n;
    document.getElementById('rv').textContent=riem(n).toFixed(3);}
  function build(){const ns=[3,6,12,24,48,96];document.getElementById('seg').innerHTML=ns.map(k=>`<span class="segb ${k===n?'on':''}" data-k="${k}">${k}</span>`).join('');
    document.querySelectorAll('#seg .segb').forEach(b=>b.onclick=()=>{n=+b.dataset.k;build();draw();});}
  build();draw();
  numChk(stage.querySelector('.card'),9,()=>{addReveal(`<div class="rh">✓ The area is exactly 9</div><p>Right-endpoint rectangles <em>overshoot</em> here (an increasing curve pokes above each strip's left part), so $R_3=14$, but the overshoot shrinks like $\\frac1n$: $R_6=11.4$, $R_{24}=9.6$, $R_{96}\\approx 9.1\\ldots$, homing in on $9$. That limit <em>is</em> the area, and we name it the <b>definite integral</b>: $\\int_0^3 x^2\\,dx = \\lim_{n\\to\\infty} R_n = 9$. (Algebraically $R_n=\\frac{27}{n^3}\\cdot\\frac{n(n+1)(2n+1)}{6}\\to 9$.)</p>`);});
  setHints([`Read the Rₙ box as you raise n: 14, 11.4, 10.2, 9.6, 9.3, 9.1… what whole number is it converging to?`,`It approaches 9.`]);
}

function c4_defint(){
  stage.innerHTML=`<div class="card"><h2>The definite integral: signed area as a limit</h2>
    <p>That limit of Riemann sums, which exists for any continuous $f$ no matter how you slice, is the <b>definite integral</b>:</p>
    <div class="eqbox">$$\\int_a^b f(x)\\,dx = \\lim_{n\\to\\infty}\\sum_{i=1}^{n} f(x_i)\\,\\Delta x$$</div>
    <p>The elongated S is a "sum"; $a,b$ are the limits, $f(x)$ the integrand, $dx$ the vanishing width. One crucial wrinkle: where $f$ dips <em>below</em> the axis, its heights are negative, so those strips subtract. The integral is <b>signed area</b> — area above the axis minus area below. Drag the right edge across $f(x)=x$ and watch the running total; the <span class="rd">red</span> region (below the axis) counts against the <span class="grn">green</span>.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">right edge b</div><div class="v" id="bv">—</div></div><div class="rdc"><div class="k">signed area ∫₋₂ᵇ</div><div class="v" id="av">—</div></div></div>
    <div class="eqbox">$$\\begin{gathered}\\textstyle\\int_a^a f=0 \\qquad \\int_b^a f=-\\int_a^b f \\\\[2pt] \\textstyle\\int_a^b(cf+g)=c\\!\\int_a^b f+\\int_a^b g \\qquad \\int_a^c f+\\int_c^b f=\\int_a^b f\\end{gathered}$$</div>
    <div class="task"><b>Signed area</b>What is $\\displaystyle\\int_{-2}^{2} x\\,dx$ — the net signed area of $f(x)=x$ from $-2$ to $2$?</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:-2.6,xmax:2.6,ymin:-2.6,ymax:2.6});
  const f=x=>x;let b=1.1;const sarea=b=>b*b/2-2;
  function draw(){pl.grid();const{ctx}=pl;const lo=-2,step=(b-lo)/200;
    if(step>0)for(let t=lo;t<b;t+=step){const y=f(t),X0=pl.px(t),X1=pl.px(t+step),Y0=pl.py(0),Y1=pl.py(y);
      ctx.fillStyle=y>=0?'rgba(63,185,143,0.30)':'rgba(226,102,79,0.30)';ctx.fillRect(X0,Math.min(Y0,Y1),X1-X0,Math.abs(Y0-Y1));}
    pl.curve(f,'#7ab8ff');pl.vline(b,'#3a4c66',true);pl.point(b,f(b),'#e8b84b',5);
    document.getElementById('bv').textContent=b.toFixed(2);
    document.getElementById('av').textContent=sarea(b).toFixed(3);}
  xdrag(cv,pl,x=>{b=Math.max(-1.9,Math.min(2.5,x));draw();});draw();
  numChk(stage.querySelector('.card'),0,()=>{addReveal(`<div class="rh">✓ 0 — the halves cancel</div><p>From $-2$ to $0$ the curve is below the axis (a triangle of area $2$, counted <em>negative</em>); from $0$ to $2$ it's an equal triangle above (area $+2$). Net: $-2+2=0$. Signed area is why an integral can be zero over a nonempty region, and why $\\int$ of an odd function over a symmetric interval always vanishes. The four properties boxed above — all inherited from the sums — are the algebra you'll compute with.</p>`);});
  setHints([`Below the axis counts negative. The triangle on the left ($-2$ to $0$) and the one on the right ($0$ to $2$) are mirror images.`,`Equal negative and positive triangles cancel: 0.`]);
}

function c4_ftc1(){
  stage.innerHTML=`<div class="card"><h2>Fundamental Theorem, Part 1: the area function's slope is the height</h2>
    <p>Freeze the left edge at $a$ and let the right edge $x$ slide — the area becomes a <em>function</em>, the <b>area-so-far</b> $A(x)=\\int_a^x f(t)\\,dt$. The claim is that its derivative is simply the height of the curve, $A'(x)=f(x)$. We prove it straight from the limit definition, $A'(x)=\\lim_{h\\to0}\\frac{A(x+h)-A(x)}{h}$ — no "infinitesimal strips," every step checkable:</p>
    <p><b>1. The top of the fraction is one thin sliver of area.</b> Growing the right edge from $x$ to $x+h$ adds exactly the area over the little interval $[x,x+h]$. In symbols (additivity of the integral): $\\;A(x+h)-A(x)=\\int_a^{x+h} f-\\int_a^x f=\\int_x^{x+h} f(t)\\,dt$.</p>
    <p><b>2. So the whole fraction is an average height.</b> Divide that sliver of area by its width $h$ and you get the <em>average value</em> of $f$ across the sliver: $\\;\\dfrac{A(x+h)-A(x)}{h}=\\dfrac{1}{h}\\int_x^{x+h} f(t)\\,dt$.</p>
    <p><b>3. An average is boxed in by the lowest and highest heights.</b> On the little interval $[x,x+h]$, continuous $f$ has a smallest value $m$ and a largest value $M$. The sliver's area can't beat the tall rectangle $M\\cdot h$ or fall below the short one $m\\cdot h$, so its average height lies between them: $\\;m\\le \\dfrac{1}{h}\\int_x^{x+h} f\\le M$.</p>
    <p><b>4. Shrink the width and squeeze.</b> As $h\\to 0$ the interval collapses onto $x$, so its lowest and highest values both close in on $f(x)$: $m\\to f(x)$ and $M\\to f(x)$. The average is trapped between two quantities heading to the same place, so by the squeeze theorem (Module 2) it has nowhere else to land:</p>
    <div class="eqbox">$$A'(x) = \\lim_{h\\to 0}\\frac{1}{h}\\int_x^{x+h} f(t)\\,dt = \\color{#e8b84b}{f(x)}$$</div>
    <p>The derivative of the area function is the height of the curve — earned from the limit definition and the squeeze theorem, not an infinitesimal picture. Below, $f(x)=x$ (blue) and its area function $A(x)=\\int_0^x t\\,dt = \\tfrac{x^2}{2}$ (green). Drag $x$: the shaded area is $A(x)$, and the green curve's <em>slope</em> tracks the blue curve's <em>height</em>.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">height f(x)</div><div class="v" id="hv">—</div></div><div class="rdc"><div class="k">area A(x)</div><div class="v" id="av">—</div></div></div>
    <div class="task"><b>Read the link</b>As the right edge moves, the rate at which accumulated area grows equals which quantity?</div>
    <div class="choices" id="ch"></div></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:-0.3,xmax:3.2,ymin:-0.4,ymax:5});
  const f=x=>x,A=x=>x*x/2;let x0=1.5;
  function draw(){pl.grid();const{ctx}=pl;const step=x0/140;
    if(step>0)for(let t=0;t<x0;t+=step){const X0=pl.px(t),X1=pl.px(t+step),Y0=pl.py(0),Y1=pl.py(f(t));ctx.fillStyle='rgba(122,184,255,0.18)';ctx.fillRect(X0,Y1,X1-X0,Y0-Y1);}
    pl.curve(f,'#7ab8ff');pl.curve(A,'#3fb98f');pl.vline(x0,'#3a4c66',true);
    const m=f(x0);ctx.strokeStyle='rgba(63,185,143,0.6)';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx.beginPath();
    const y0=A(x0)+m*(pl.xmin-x0),y1=A(x0)+m*(pl.xmax-x0);ctx.moveTo(pl.px(pl.xmin),pl.py(y0));ctx.lineTo(pl.px(pl.xmax),pl.py(y1));ctx.stroke();ctx.setLineDash([]);
    pl.point(x0,f(x0),'#7ab8ff',5);pl.point(x0,A(x0),'#3fb98f',5);
    document.getElementById('hv').textContent=f(x0).toFixed(2);
    document.getElementById('av').textContent=A(x0).toFixed(2);}
  xdrag(cv,pl,x=>{x0=Math.max(0,Math.min(3,x));draw();});draw();
  const opts=[['the <b>height</b> of the curve there, $f(x)$','y'],['the area itself, $A(x)$','n'],['zero — area accumulates at a constant rate','n'],['the width $dx$','n']];
  mcChoices(document.getElementById('ch'),opts,()=>{addReveal(`<div class="rh">✓ The rate equals the height, f(x)</div><p>Watch it on screen: at $x=2$ the blue height is $2$, and the green area curve is climbing with slope $2$. The new area added per step is exactly a strip of the current height — so $A'(x)=f(x)$. This is <b>FTC Part 1</b>, and its consequence is enormous: the area function is an <em>antiderivative</em> of $f$. Differentiation and area-accumulation are inverse operations. The next two beats cash that in.</p>`);});
  setHints([`Per step, the area added divided by the step width is the average height of f over that sliver — and as the sliver shrinks, that average is squeezed to f(x) itself.`]);
}

function c4_antideriv(){
  stage.innerHTML=`<div class="card"><h2>Antiderivatives and the reverse power rule</h2>
    <p>FTC Part 1 makes the area function an <b>antiderivative</b>: a function $F$ whose derivative is $f$. Since adding a constant doesn't change a derivative, antiderivatives come in a family $F(x)+C$ — and by the MVT that constant is the <em>only</em> freedom (two functions with equal derivatives differ by a constant). The family is written as the <b>indefinite integral</b> $\\int f(x)\\,dx = F(x)+C$.</p>
    <p>Running the power rule backwards gives the workhorse formula — bump the exponent up by one and divide by it:</p>
    <div class="eqbox">$$\\int x^n\\,dx = \\frac{x^{n+1}}{n+1} + C \\qquad (n \\ne -1)$$</div>
    <p>Check it by differentiating the right side: $\\frac{d}{dx}\\frac{x^{n+1}}{n+1} = \\frac{(n+1)x^n}{n+1} = x^n$ ✓. The one exponent it can't touch is $n=-1$ (it would divide by zero) — that's $\\int \\frac{dx}{x}$, the gap flagged since Module 3, which the last beat finally fills.</p>
    <div class="task"><b>Recover a function from its rate</b>If $F'(x) = 3x^2$ and $F(0) = 5$, find $F(2)$.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  numChk(stage.querySelector('.card'),13,()=>{addReveal(`<div class="rh">✓ F(2) = 13</div><p>Antidifferentiate: $\\int 3x^2\\,dx = x^3 + C$, so $F(x)=x^3+C$. The condition $F(0)=5$ pins the constant: $0+C=5$, so $C=5$ and $F(x)=x^3+5$. Then $F(2)=8+5=13$. The $+C$ isn't a formality — you need one data point (an "initial condition") to select the one antiderivative you want from the family.</p>`);});
  setHints([`Antiderivative of 3x² is x³ + C. Use F(0)=5 to find C, then evaluate at 2.`,`F(x)=x³+5, so F(2)=8+5=13.`]);
}

function c4_ftc2(){
  stage.innerHTML=`<div class="card"><h2>Fundamental Theorem, Part 2: evaluate by antiderivative</h2>
    <p>Part 2 evaluates any definite integral from an antiderivative — and it drops out directly from the <em>discrete</em> Riemann sum and the Mean Value Theorem, welding the two halves of the course together. Let $F$ be any antiderivative of $f$ (so $F'=f$), and cut $[a,b]$ into $n$ slices at $a=x_0&lt;x_1&lt;\\dots&lt;x_n=b$.</p>
    <p><b>1. Telescope the total change in $F$.</b> Add up $F$'s change across the slices. Each interior value gets added once and subtracted once, so they all cancel, leaving only the endpoints:</p>
    <div class="eqbox">$$\\underbrace{(F(x_1)\\!-\\!F(x_0))+(F(x_2)\\!-\\!F(x_1))+\\cdots+(F(x_n)\\!-\\!F(x_{n-1}))}_{\\text{every interior } F(x_i) \\text{ cancels}}=F(b)-F(a)$$</div>
    <p><b>2. Rewrite each slice's change with the MVT.</b> Over one slice $[x_{i-1},x_i]$, the Mean Value Theorem (Module 4) gives a point $c_i$ inside where the slope equals the slice's average slope. Multiply that slope by the slice's width and you get the slice's <em>exact</em> change: $\\;F(x_i)-F(x_{i-1})=F'(c_i)\\,\\Delta x_i=f(c_i)\\,\\Delta x_i$ (using $F'=f$).</p>
    <p><b>3. The total is now a Riemann sum.</b> Drop those into step 1: $\\;F(b)-F(a)=\\sum_{i=1}^{n} f(c_i)\\,\\Delta x_i$. The right side is a Riemann sum for $f$ — and this equation is <em>exact</em> for any slicing, coarse or fine.</p>
    <p><b>4. Refine, and read off the answer.</b> Let the slices shrink ($\\Delta x_i\\to 0$). The Riemann sum on the right converges to $\\int_a^b f$ (that's the definition of the integral), while the left side, $F(b)-F(a)$, doesn't depend on the slicing at all — it never budges. A fixed number that equals something converging must equal the limit:</p>
    <div class="eqbox">$$\\int_a^b f(x)\\,dx = F(b)-F(a) \\qquad \\color{#5d7186}{\\text{written }\\big[F(x)\\big]_a^b}$$</div>
    <p>No limits of sums to grind by hand — find an antiderivative and subtract. The area shaded below is $\\int_0^3 x^2\\,dx$, the number you squeezed out of Riemann sums earlier; now watch it fall out in one line.</p>
    <canvas id="cv" width="640" height="360"></canvas>
    <div class="task"><b>Evaluate</b>Using $F(x)=\\tfrac{x^3}{3}$ (an antiderivative of $x^2$), compute $\\displaystyle\\int_0^3 x^2\\,dx$.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:-0.3,xmax:3.3,ymin:-0.6,ymax:9.8});
  const f=x=>x*x;
  function draw(){pl.grid();const{ctx}=pl;const step=3/200;
    for(let t=0;t<3;t+=step){const X0=pl.px(t),X1=pl.px(t+step),Y0=pl.py(0),Y1=pl.py(f(t));ctx.fillStyle='rgba(122,184,255,0.18)';ctx.fillRect(X0,Y1,X1-X0,Y0-Y1);}
    pl.curve(f,'#7ab8ff');pl.label(1.05,7.4,'∫₀³ x² dx','#9fb0c4');}
  draw();
  numChk(stage.querySelector('.card'),9,()=>{addReveal(`<div class="rh">✓ 9, in one line</div><p>$\\int_0^3 x^2\\,dx = \\big[\\tfrac{x^3}{3}\\big]_0^3 = \\tfrac{27}{3} - 0 = 9$. The limit of sums you laboured over is now a single subtraction. <b>This is the theorem the whole subject is named for</b>: the area problem (integration) and the slope problem (differentiation) are inverse operations, so every derivative rule from Modules 3–4, read backwards, becomes an integration formula. Curves whose antiderivative you can name are suddenly trivial to integrate.</p>`);});
  setHints([`FTC Part 2: evaluate the antiderivative at 3 and at 0, then subtract.`,`[x³/3] from 0 to 3 = 27/3 − 0 = 9.`]);
}

function c4_ln(){
  stage.innerHTML=`<div class="card"><h2>Defining the natural logarithm from area</h2>
    <p>The reverse power rule left exactly one hole: $n=-1$, the integral $\\int\\frac{dx}{x}$. It's tempting to say "that's just $\\ln x$, the log base $e$" and move on — but that would be circular. To lean on $\\log_e$ we'd first need $e^x$ defined for <em>every</em> real $x$ (irrational exponents need a limit we haven't built) and the fact $(e^x)'=e^x$ (which needs $e$ pinned down so precisely that the argument eats its own tail). We already own a tool that needs nothing new — the integral — so we turn the gap into a <em>definition</em>.</p>
    <div class="defn"><span class="dt">Definition — natural logarithm</span>$\\displaystyle \\ln x := \\int_1^x \\frac{dt}{t} \\quad (x>0)$ — the signed area under $\\tfrac1t$ from $1$ out to $x$.</div>
    <p>This is not a modern trick; it retraces history. Logarithms (Napier, <b>1614</b>) were in daily use long before $e$ was a named number, and in <b>1649</b> de Sarasa recognized that the area under the hyperbola $y=\\tfrac1t$ <em>behaves</em> like a logarithm — decades before Euler identified $e$ in the 1700s. Two things make this definition inevitable rather than arbitrary:</p>
    <p><b>Why start at 1?</b> A logarithm must send $1\\mapsto 0$. Starting the area at $1$ delivers exactly that: $\\ln 1 = \\int_1^1 \\tfrac{dt}{t} = 0$ (an empty interval has no area). Start anywhere else and you'd shift everything by a constant, breaking $\\ln 1 = 0$.</p>
    <p><b>The derivative, for free.</b> FTC Part 1, applied to this definition, fills the $n=-1$ hole in the power rule immediately:</p>
    <div class="eqbox">$$(\\ln x)' = \\frac{d}{dx}\\int_1^x \\frac{dt}{t} = \\color{#e8b84b}{\\frac{1}{x}}$$</div>
    <p><b>Why it really is a logarithm.</b> Calling it a log takes more than $\\ln 1 = 0$ — the defining property is that it turns products into sums, $\\ln(ab)=\\ln a+\\ln b$. We can <em>prove</em> our area function does this, using only the chain rule and the MVT. Fix $a&gt;0$ and let $g(x)=\\ln(ax)-\\ln x$. Differentiate (chain rule on the first term, and $(\\ln x)'=\\tfrac1x$ from just above):</p>
    <div class="eqbox">$$g'(x) = a\\cdot\\frac{1}{ax} - \\frac{1}{x} = \\frac{1}{x}-\\frac{1}{x} = 0$$</div>
    <p>A function with zero derivative on an interval is constant (a corollary of the MVT, Module 4), so $g(x)=g(1)=\\ln a-\\ln 1=\\ln a$ for all $x$. That says $\\ln(ax)=\\ln x+\\ln a$; set $x=b$ and you have $\\color{#e8b84b}{\\ln(ab)=\\ln a+\\ln b}$ — proven, not asserted. (The same trick on $h(x)=\\ln(x^p)-p\\ln x$ gives $h'=0$, hence $\\ln(x^p)=p\\ln x$.) So this integral genuinely <em>is</em> a logarithm.</p>
    <p>Drag $x$ and read $\\ln x$ off the shaded area: positive to the right of $1$, negative to the left (the area is swept backwards).</p>
    <canvas id="cv" width="640" height="360"></canvas>
    <div class="readout"><div class="rdc"><div class="k">x</div><div class="v" id="xv">—</div></div><div class="rdc"><div class="k">ln x = shaded area</div><div class="v" id="lv">—</div></div></div>
    <div class="task"><b>Apply FTC to ln</b>Since $(\\ln x)' = \\tfrac1x$, what is $(\\ln x)'$ at $x = 2$? (Enter a decimal.)</div>
    <div class="entry"><input id="ni" inputmode="decimal" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:0,xmax:5,ymin:-0.4,ymax:3.6});
  const f=t=>t>0.06?1/t:NaN;let x0=2;
  const lnA=x=>{const n=500,dx=(x-1)/n;let s=0;for(let i=0;i<n;i++){const t=1+(i+0.5)*dx;s+=(1/t)*dx;}return s;};
  function draw(){pl.grid();const{ctx}=pl;const lo=Math.min(1,x0),hi=Math.max(1,x0),step=(hi-lo)/220;
    if(step>0)for(let t=lo;t<hi;t+=step){const X0=pl.px(t),X1=pl.px(t+step),Y0=pl.py(0),Y1=pl.py(1/t);ctx.fillStyle=x0>=1?'rgba(63,185,143,0.26)':'rgba(226,102,79,0.26)';ctx.fillRect(X0,Y1,X1-X0,Y0-Y1);}
    pl.curve(f,'#7ab8ff');pl.vline(1,'#2b3a4f',true);pl.vline(x0,'#3a4c66',true);
    document.getElementById('xv').textContent=x0.toFixed(3);
    document.getElementById('lv').textContent=lnA(x0).toFixed(3);}
  xdrag(cv,pl,x=>{x0=Math.max(0.3,Math.min(5,x));draw();});draw();
  numChk(stage.querySelector('.card'),0.5,()=>{addReveal(`<div class="rh">✓ (ln 2)′ = ½ = 0.5</div><p>$(\\ln x)'=\\tfrac1x$, so at $x=2$ it is $\\tfrac12$. The picture confirms the shape: $\\ln 1 = 0$, $\\ln x > 0$ for $x > 1$, $\\ln x &lt; 0$ for $0 &lt; x &lt; 1$, and because the integrand $\\tfrac1t$ is always positive, $\\ln$ is <b>strictly increasing</b> everywhere. That single fact — strictly increasing, running over all real values — is what guarantees it has an inverse, and that inverse is the doorway to $e$ and $e^x$, next.</p>`);},s=>parseFloat(s));
  setHints([`The derivative of ln x is 1/x. Put x = 2.`,`1/2 = 0.5.`]);
}
function c4_e(){
  stage.innerHTML=`<div class="card"><h2>The number e and the function eˣ</h2>
    <p>From the last beat, $\\ln$ is strictly increasing and sweeps through every real value — from $-\\infty$ as $x\\to 0^+$ up to $+\\infty$. So it hits each height exactly once; in particular there is a <em>single</em> input where the accumulated area equals precisely $1$. That number is how we define $e$.</p>
    <div class="defn"><span class="dt">Definition — the number e</span>$e$ is the unique number with $\\ln e = 1$: the point where the area under $\\tfrac1t$ (starting at $1$) first reaches $1$. Numerically $e \\approx 2.71828$.</div>
    <p>Because $\\ln$ is one-to-one, it has an inverse — and that inverse is precisely what the symbol $e^x$ will <em>mean</em>:</p>
    <div class="defn"><span class="dt">Definition — the exponential function</span>$e^x$ is the inverse of $\\ln$: $\\ln(e^x)=x$ and $e^{\\ln x}=x$. This finally defines $e^x$ for every real $x$ — irrational exponents included — with no appeal to "repeated multiplication."</div>
    <p>Its derivative — the self-replicating property teased back in Module 1 — now falls out by differentiating the inverse relationship. Let $y=e^x$, so $\\ln y = x$. Differentiate both sides in $x$ (chain rule on the left, since $y$ depends on $x$):</p>
    <div class="eqbox">$$\\frac{1}{y}\\,\\frac{dy}{dx} = 1 \\;\\Longrightarrow\\; \\frac{dy}{dx} = y \\;\\Longrightarrow\\; \\color{#e8b84b}{(e^x)' = e^x}$$</div>
    <p>$e^x$ is its own derivative — the one function (up to scaling) whose growth rate equals its own height, which is why every growth or decay law is written $e^{kt}$. Every other exponential reduces to it: $a^x = e^{x\\ln a}$, so $(a^x)' = a^x\\ln a$. Drag $x$ until the shaded area hits exactly $1$ — the spot where it does is $e$.</p>
    <canvas id="cv" width="640" height="360"></canvas>
    <div class="readout"><div class="rdc"><div class="k">x</div><div class="v" id="xv">—</div></div><div class="rdc"><div class="k">area = ln x</div><div class="v" id="lv">—</div></div></div>
    <div class="task"><b>Use the derivative</b>Since $(e^x)' = e^x$ and $e^0 = 1$, what is the slope of $e^x$ at $x = 0$?</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:0,xmax:5,ymin:-0.4,ymax:3.6});
  const f=t=>t>0.06?1/t:NaN;let x0=1.5;
  const lnA=x=>{const n=500,dx=(x-1)/n;let s=0;for(let i=0;i<n;i++){const t=1+(i+0.5)*dx;s+=(1/t)*dx;}return s;};
  function draw(){pl.grid();const{ctx}=pl;const ln=lnA(x0),atE=Math.abs(ln-1)<0.02;const step=(x0-1)/220;
    if(step>0)for(let t=1;t<x0;t+=step){const X0=pl.px(t),X1=pl.px(t+step),Y0=pl.py(0),Y1=pl.py(1/t);ctx.fillStyle=atE?'rgba(232,184,75,0.32)':'rgba(63,185,143,0.24)';ctx.fillRect(X0,Y1,X1-X0,Y0-Y1);}
    pl.curve(f,'#7ab8ff');pl.vline(1,'#2b3a4f',true);pl.vline(x0,atE?'#e8b84b':'#3a4c66',true);
    if(atE)pl.label(x0-0.02,3.35,'x = e','#e8b84b');
    document.getElementById('xv').textContent=x0.toFixed(3);
    document.getElementById('lv').textContent=ln.toFixed(3);
    if(!draw.hitE&&ln>=1){draw.hitE=true;flash('✓ area = 1 → x = e ≈ 2.718');}}
  xdrag(cv,pl,x=>{x0=Math.max(0.3,Math.min(5,x));draw();});draw();
  numChk(stage.querySelector('.card'),1,()=>{addReveal(`<div class="rh">✓ slope = 1 at x = 0</div><p>$(e^x)'=e^x$, so the slope at $0$ is $e^0=1$ — the curve crosses the $y$-axis climbing at exactly $45°$. With $\\ln e = 1$ from the area and $(e^x)'=e^x$ from the inverse, the entire $e$–$\\ln$ pair is now built from the integral alone: no unproven limit, no circular appeal to "log base $e$." The transcendentals promised since Module 3 are finally rigorous — assembled, like everything in this course, from pieces you already had.</p>`);});
  setHints([`(eˣ)′ = eˣ, and e⁰ = 1, so the slope at 0 is just e⁰.`,`e⁰ = 1.`]);
}

function c4_problems(){
  stage.innerHTML=`<div class="card"><h2>Problem set</h2>
    <p>Uses Modules 1–5 — and now $\\ln$ and $e^x$ are fair game. Paper first; solutions fold open.</p>

    <div class="prob"><span class="lvl">Riemann sum</span><div class="ph">Problem 1</div>
    <p>Estimate $\\displaystyle\\int_0^2 x^2\\,dx$ with $n=4$ right-endpoint rectangles, and compare to the exact value.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\Delta x = \\tfrac12$; right endpoints $0.5,1,1.5,2$ with heights $0.25,1,2.25,4$. $R_4 = \\tfrac12(0.25+1+2.25+4) = \\tfrac12(7.5) = 3.75$. Exact: $\\big[\\tfrac{x^3}{3}\\big]_0^2 = \\tfrac{8}{3} \\approx 2.67$. The estimate overshoots (increasing curve, right endpoints), as expected.</p></div></details></div>

    <div class="prob"><span class="lvl">FTC evaluation</span><div class="ph">Problem 2</div>
    <p>Evaluate $\\displaystyle\\int_1^3 2x\\,dx$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Antiderivative of $2x$ is $x^2$. So $\\big[x^2\\big]_1^3 = 9 - 1 = 8$.</p></div></details></div>

    <div class="prob"><span class="lvl">trig integral</span><div class="ph">Problem 3</div>
    <p>Evaluate $\\displaystyle\\int_0^{\\pi} \\sin x\\,dx$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Since $(\\cos x)' = -\\sin x$, an antiderivative of $\\sin x$ is $-\\cos x$. So $\\big[-\\cos x\\big]_0^{\\pi} = -\\cos\\pi - (-\\cos 0) = -(-1) + 1 = 2$.</p></div></details></div>

    <div class="prob"><span class="lvl">initial condition</span><div class="ph">Problem 4</div>
    <p>Find $F$ with $F'(x) = x^2 + 1$ and $F(0) = 2$, then compute $F(3)$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$F(x) = \\tfrac{x^3}{3} + x + C$. From $F(0)=2$: $C=2$. So $F(x) = \\tfrac{x^3}{3} + x + 2$, and $F(3) = 9 + 3 + 2 = 14$.</p></div></details></div>

    <div class="prob"><span class="lvl">signed area</span><div class="ph">Problem 5</div>
    <p>Evaluate $\\displaystyle\\int_{-2}^{2} x^3\\,dx$, and explain the result geometrically.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\big[\\tfrac{x^4}{4}\\big]_{-2}^{2} = \\tfrac{16}{4} - \\tfrac{16}{4} = 0$. Geometrically, $x^3$ is odd: the negative signed area on $[-2,0]$ exactly cancels the positive area on $[0,2]$.</p></div></details></div>

    <div class="prob"><span class="lvl">FTC Part 1</span><div class="ph">Problem 6</div>
    <p>Compute $\\displaystyle\\frac{d}{dx}\\int_0^x (t^2 + 1)\\,dt$ <em>without</em> evaluating the integral.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>FTC Part 1 says the derivative of the area function is the integrand at the top limit: $\\frac{d}{dx}\\int_0^x (t^2+1)\\,dt = x^2 + 1$. (No antiderivative needed — that's the point of Part 1.)</p></div></details></div>

    <div class="prob"><span class="lvl">logarithm</span><div class="ph">Problem 7</div>
    <p>Using $\\ln x = \\int_1^x \\tfrac{dt}{t}$: state $\\ln 1$, and find $\\frac{d}{dx}\\ln(x^2)$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\ln 1 = \\int_1^1 \\tfrac{dt}{t} = 0$ (empty interval). For the derivative, chain rule with $(\\ln u)' = \\tfrac1u$: $\\frac{d}{dx}\\ln(x^2) = \\tfrac{1}{x^2}\\cdot 2x = \\tfrac{2}{x}$. (Or note $\\ln(x^2)=2\\ln x$, derivative $\\tfrac{2}{x}$ — same answer.)</p></div></details></div>

    <div class="prob"><span class="lvl">challenge — defining e</span><div class="ph">Problem 8</div>
    <p>Evaluate $\\displaystyle\\int_1^{e} \\frac{dt}{t}$, and say what it reveals about $e$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\int_1^{e}\\tfrac{dt}{t} = \\ln e - \\ln 1 = 1 - 0 = 1$. This is the <em>definition</em> of $e$ read as area: $e$ is precisely the upper limit at which the area under $\\tfrac1t$ (starting at $1$) first equals $1$. The number $e\\approx 2.718$ isn't pulled from nowhere — it's where that area hits one.</p></div></details></div>
  </div>`;
  setHints([]);unlock();
}

function c4_recap(){
  stage.innerHTML=`<div class="card"><h2>What you built</h2>
    <div class="eqbox" style="line-height:2.3">$$\\int_a^b f(x)\\,dx = \\lim_{n\\to\\infty}\\sum_{i=1}^n f(x_i)\\,\\Delta x \\quad \\color{#5d7186}{\\text{(signed area)}}$$
    <div style="text-align:center;line-height:2;color:#dbe6f4;margin-top:6px">FTC Part 1: $\\frac{d}{dx}\\int_a^x f = f(x)$ — area function's slope is the height<br>FTC Part 2: $\\int_a^b f = F(b)-F(a)$ — evaluate by any antiderivative<br>reverse power rule: $\\int x^n dx = \\frac{x^{n+1}}{n+1}+C\\ (n\\ne -1)$<br>$\\ln x := \\int_1^x \\frac{dt}{t}$, so $(\\ln x)'=\\frac1x$ · $\\ln e=1$ · $(e^x)'=e^x$</div></div>
    <p>Integration is accumulation, and the Fundamental Theorem is the whole subject's keystone: it welds area to slope, making them inverse operations. That single link let us define $\\ln$ and $e^x$ from area and close the $n=-1$ gap left open since Module 3 — nothing assumed, everything derived.</p>
    <p><b>Next — Module 6:</b> the FTC turns integration into "guess the antiderivative," so the game becomes technique. <b>Substitution</b> reverses the chain rule, <b>integration by parts</b> reverses the product rule, and partial fractions and trig methods round out the toolkit — plus area, volume, and arc-length payoffs.</p></div>`;
  setHints([]);unlock();
}
